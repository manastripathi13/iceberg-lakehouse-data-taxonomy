# Trino reads/writes Iceberg tables whose metadata lives in Nessie (main branch).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/main
iceberg.rest-catalog.warehouse=warehouse
fs.native-s3.enabled=true
s3.endpoint=http://storage:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=lakeadmin
s3.aws-secret-key=lakeadmin-secret
# Allow dbt to stamp taxonomy properties (data_owner, domain, layer, description, pii) on tables
iceberg.allowed-extra-properties=*
